[project]
name = "shooter"
version = "0.1.0"
description = "A local multiplayer raylib shooter game"
readme = "README.md"
authors = [
    { name = "Lukas", email = "lfigiel@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "raylib>=6.0.1.0"
]

[project.scripts]
shooter = "shooter:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
